name: T4/T5 V2 MySQL 8 homologation

on:
  push:
    branches:
      - "homologation/t4t5-mysql8-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql8-integration:
    name: Disposable MySQL 8 / InnoDB integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.0.30
        env:
          MYSQL_ROOT_PASSWORD: disposable-test-root
          MYSQL_DATABASE: redes_paineis_dados
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pdisposable-test-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      T4T5_MYSQL_TEST_URL: mysql+pymysql://root:disposable-test-root@127.0.0.1:3306/redes_paineis_dados?charset=utf8mb4
      T4T5_MYSQL_TESTS: "1"
      T4T5_MYSQL_TEST_MARKER: "github-actions-${{ github.run_id }}-${{ github.run_attempt }}"
    steps:
      - name: Check out selected test branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Mark the database as this run's disposable test instance
        run: |
          mysql --host=127.0.0.1 --user=root --password="$MYSQL_ROOT_PASSWORD" redes_paineis_dados \
            -e "CREATE TABLE ci_t4t5_homologation_marker (marker_value VARCHAR(128) NOT NULL PRIMARY KEY); INSERT INTO ci_t4t5_homologation_marker (marker_value) VALUES ('$T4T5_MYSQL_TEST_MARKER')"
        env:
          MYSQL_ROOT_PASSWORD: disposable-test-root

      - name: Create the disposable Data Foundation base schema
        run: mysql --host=127.0.0.1 --user=root --password="$MYSQL_ROOT_PASSWORD" < backend/sql/data-foundation-v2-proposal.sql
        env:
          MYSQL_ROOT_PASSWORD: disposable-test-root

      - name: Add the service-principal schema and synthetic principal
        run: |
          mysql --host=127.0.0.1 --user=root --password="$MYSQL_ROOT_PASSWORD" redes_paineis_dados < backend/sql/windows-bot-publication-service-principal-review.sql
          mysql --host=127.0.0.1 --user=root --password="$MYSQL_ROOT_PASSWORD" redes_paineis_dados \
            -e "INSERT INTO data_service_principals (service_principal_id,display_name,is_active) VALUES ('windows-newbi-publisher','Disposable CI test principal',1)"
        env:
          MYSQL_ROOT_PASSWORD: disposable-test-root

      - name: Apply the synthetic V1 source and its daily-head prerequisite
        run: |
          { cat backend/sql/collection-monitoring-t4-t5-registration-review.sql; printf '\nCOMMIT;\n'; } \
            | mysql --host=127.0.0.1 --user=root --password="$MYSQL_ROOT_PASSWORD" redes_paineis_dados
        env:
          MYSQL_ROOT_PASSWORD: disposable-test-root

      - name: Apply the daily-head source constraint prerequisite in the disposable database
        run: mysql --host=127.0.0.1 --user=root --password="$MYSQL_ROOT_PASSWORD" redes_paineis_dados < backend/sql/collection-monitoring-t4-t5-daily-head-constraint-review.sql
        env:
          MYSQL_ROOT_PASSWORD: disposable-test-root

      - name: Apply the reviewed V2 SQL to the disposable database
        run: mysql --host=127.0.0.1 --user=root --password="$MYSQL_ROOT_PASSWORD" redes_paineis_dados < backend/sql/collection-monitoring-t4-t5-v2-logical-batch-review.sql
        env:
          MYSQL_ROOT_PASSWORD: disposable-test-root

      - name: Run the T4/T5 unit and real InnoDB integration suites
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_t4t5_logical_batches.py
          tests/test_t4t5_mysql8_integration.py
          --junitxml=../t4t5-mysql8-report.xml

      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t4t5-mysql8-homologation-report
          path: t4t5-mysql8-report.xml
          if-no-files-found: warn
